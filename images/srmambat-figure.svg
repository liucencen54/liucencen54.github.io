<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e5eef9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ca5ff"/>
      <stop offset="100%" stop-color="#2860d8"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bc6ff"/>
      <stop offset="100%" stop-color="#3a78f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ce0bf"/>
      <stop offset="100%" stop-color="#169c81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a3d73" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#36538b"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="32" fill="url(#bg)"/>
  <rect x="36" y="36" width="1128" height="568" rx="28" stroke="#c8d8f0" stroke-width="2" stroke-dasharray="10 10"/>

  <text x="70" y="98" fill="#17325d" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">SRMamba-T</text>
  <text x="70" y="136" fill="#4a628f" font-family="Arial, Helvetica, sans-serif" font-size="24">Hybrid Mamba-Transformer pipeline for lightweight single image super-resolution</text>

  <g filter="url(#shadow)">
    <rect x="86" y="206" width="162" height="214" rx="24" fill="#ffffff"/>
    <rect x="108" y="230" width="118" height="118" rx="16" fill="#d7e7fb" stroke="#8bb2e8"/>
    <path d="M108 320L141 286L167 307L190 274L226 320V348H108V320Z" fill="#7fafea"/>
    <circle cx="198" cy="255" r="14" fill="#ffd76a"/>
    <text x="167" y="385" text-anchor="middle" fill="#17325d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">LR Input</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="188" width="198" height="250" rx="28" fill="url(#panel)"/>
    <text x="409" y="250" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Mamba</text>
    <text x="409" y="290" text-anchor="middle" fill="#d9ecff" font-family="Arial, Helvetica, sans-serif" font-size="24">long-range scan</text>
    <path d="M350 352H468" stroke="#d9ecff" stroke-width="12" stroke-linecap="round"/>
    <path d="M350 388H468" stroke="#d9ecff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M350 424H468" stroke="#d9ecff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="188" width="198" height="250" rx="28" fill="url(#panel2)"/>
    <text x="647" y="250" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Transformer</text>
    <text x="647" y="290" text-anchor="middle" fill="#e8f3ff" font-family="Arial, Helvetica, sans-serif" font-size="24">global context</text>
    <g stroke="#e8f3ff" stroke-width="6" opacity="0.9">
      <line x1="586" y1="342" x2="708" y2="418"/>
      <line x1="586" y1="418" x2="708" y2="342"/>
      <line x1="586" y1="380" x2="708" y2="380"/>
      <line x1="647" y1="332" x2="647" y2="428"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="786" y="188" width="198" height="250" rx="28" fill="url(#accent)"/>
    <text x="885" y="246" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Fusion + MSSM</text>
    <text x="885" y="286" text-anchor="middle" fill="#d9fff5" font-family="Arial, Helvetica, sans-serif" font-size="24">feature fusion</text>
    <text x="885" y="316" text-anchor="middle" fill="#d9fff5" font-family="Arial, Helvetica, sans-serif" font-size="24">multi-directional scan</text>
    <rect x="835" y="350" width="100" height="62" rx="16" fill="#ffffff" fill-opacity="0.22" stroke="#d9fff5"/>
    <path d="M853 381H917" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M885 349V413" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1014" y="206" width="100" height="214" rx="24" fill="#ffffff"/>
    <rect x="1038" y="230" width="52" height="118" rx="14" fill="#d7e7fb" stroke="#8bb2e8"/>
    <path d="M1038 320L1050 306L1064 295L1080 282L1090 320V348H1038V320Z" fill="#7fafea"/>
    <text x="1064" y="385" text-anchor="middle" fill="#17325d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">HR</text>
  </g>

  <path d="M250 312H296" stroke="#36538b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M510 312H534" stroke="#36538b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M748 312H772" stroke="#36538b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M986 312H1000" stroke="#36538b" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="600" y="526" text-anchor="middle" fill="#17325d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Core idea</text>
  <text x="600" y="566" text-anchor="middle" fill="#4a628f" font-family="Arial, Helvetica, sans-serif" font-size="22">Combine Mamba efficiency, Transformer global modeling, and feature fusion for better SR quality with lower cost.</text>
</svg>
